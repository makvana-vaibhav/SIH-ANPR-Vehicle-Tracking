# Live-camera configuration.
#
# The production worker runs this. It differs from `default` in what a live
# camera demands rather than in what it detects:
#
#   * No annotated video, no crops, no HTML report. Diagnostic output costs
#     roughly three times the inference it observes, and a worker watching a
#     camera for a month cannot be writing JPEGs for every vehicle.
#   * Scheduling is a little more aggressive, because falling behind a live
#     source costs alert latency, and latency is the thing the platform sells.
#   * Provisional events are emitted while a vehicle is still in view, so the
#     platform can raise an alert before the car has left the junction.
#
# Everything that determines *what* is detected — the models, the thresholds,
# the consensus rules — is inherited from `default` unchanged, so accuracy
# measured in the lab is the accuracy this produces.
extends: default.yaml
name: stream
description: Live RTSP worker — inference and events only, no diagnostic artifacts.

plate:
  schedule:
    # Lower than default.yaml's 3/90: a live camera has a fixed transit time
    # per vehicle, and the vehicle-width gate in particular used to withhold
    # the *first* search until a car was already close to/leaving frame on a
    # wide-angle view. `ocr.min_crop_width` (52px, default.yaml) and
    # `is_legible()` already reject a crop too small to read, so opening this
    # gate earlier costs a cheap failed legibility check on a still-distant
    # vehicle rather than nothing — it does not spend an OCR call. Sweep with
    # `ailab compare` against `time_to_first_read_s`/`time_to_confirmed_s`
    # (see Track.first_read_latency_s) before moving these further.
    min_interval: 2
    max_interval: 16
    min_vehicle_width: 60

ocr:
  max_reads_per_track: 20
  stop_when_confident: true
  stop_min_agreeing: 4
  stop_min_confidence: 0.85

output:
  annotated_video: false
  # Plate crops ON, and they do not go to disk.
  #
  # This was false because streaming existed to measure latency, and writing
  # JPEGs to a run directory during a latency run is noise. The platform now
  # hands the runner a `run_dir` that uploads to object storage instead
  # (services/ai-worker/ai_worker/crops.py), and the plate crop is what an
  # operator needs to confirm an alert is the vehicle they were told about.
  #
  # Vehicle crops stay off: they are several times the size of a plate crop and
  # nothing on any screen shows one.
  save_plate_crops: true
  save_vehicle_crops: false
  # Two per track, not the batch default of 25. The consensus keeps the best
  # read anyway, and 25 uploads per vehicle would be paying object-storage cost
  # to store 23 pictures nobody opens.
  max_crops_per_track: 2
  keyframes: false
  html_report: false
  events_jsonl: false

stream:
  # Emit the final event this long after a vehicle was last seen. Short enough
  # that history is timely, long enough to survive a brief occlusion.
  retire_after_s: 1.5
  observed_confidence_delta: 0.10
  max_observed_per_track: 3
