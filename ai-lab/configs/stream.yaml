# Live-camera configuration.
#
# The production worker runs this. It differs from `default` in what a live
# camera demands rather than in what it detects:
#
#   * No annotated video, no crops, no HTML report. Diagnostic output costs
#     roughly three times the inference it observes, and a worker watching a
#     camera for a month cannot be writing JPEGs for every vehicle.
#   * Scheduling is a little more aggressive, because falling behind a live
#     source costs alert latency, and latency is the thing the platform sells.
#   * Provisional events are emitted while a vehicle is still in view, so the
#     platform can raise an alert before the car has left the junction.
#
# Everything that determines *what* is detected — the models, the thresholds,
# the consensus rules — is inherited from `default` unchanged, so accuracy
# measured in the lab is the accuracy this produces.
extends: default.yaml
name: stream
description: Live RTSP worker — inference and events only, no diagnostic artifacts.

plate:
  # Ignore a plate too small to be read, rather than finding it and failing.
  #
  # Readability on live 1080p footage is decided by plate size, not by detector
  # confidence and not by shape. Measured over 2,367 drawn boxes: vehicles that
  # produced a confident reading had plates 63 px wide (p25), those that never
  # read had 25 px (p25) — while detector confidence barely separated them
  # (0.63 vs 0.56) and geometry separated them the wrong way. A 40 px floor
  # drops 60% of the boxes that were never going to yield a plate and 1% of the
  # ones that did.
  #
  # It is also why the screen was unreadable: better than half of every
  # rectangle drawn was a correctly-located plate of a car too far away to read,
  # displayed identically to one about to resolve. And the reads it skips were
  # not free — they were OCR attempts spent on plates that could not be read,
  # on a worker whose frame rate is CPU-bound.
  min_plate_width: 40
  schedule:
    # Left at 4. Searching every *other* analysed frame was tried, on the theory
    # that time-to-consensus is bounded by how often a plate is looked at, and
    # it measured worse: time-to-printed-plate 2067 -> 2668 ms (p50) with
    # dropped frames 28% -> 33%. This worker is CPU-bound, so a more expensive
    # frame simply means fewer frames, and consensus needs frames more than it
    # needs attempts per frame. Do not lower this without first buying back the
    # CPU it costs.
    min_interval: 4
    max_interval: 16
    min_vehicle_width: 100

ocr:
  max_reads_per_track: 20
  stop_when_confident: true
  # Three agreeing reads, not four. This is when the scheduler stops *searching*
  # a converged vehicle, so it decides how much of the budget is spent
  # confirming a plate that is already settled rather than finding the next one.
  # Lowering it frees those reads for vehicles with nothing yet; the consensus
  # that decides what is *printed* is unchanged, so this buys throughput without
  # lowering the bar a reading has to clear.
  stop_min_agreeing: 3
  stop_min_confidence: 0.85

output:
  annotated_video: false
  # Plate crops ON, and they do not go to disk.
  #
  # This was false because streaming existed to measure latency, and writing
  # JPEGs to a run directory during a latency run is noise. The platform now
  # hands the runner a `run_dir` that uploads to object storage instead
  # (services/ai-worker/ai_worker/crops.py), and the plate crop is what an
  # operator needs to confirm an alert is the vehicle they were told about.
  #
  # Vehicle crops stay off: they are several times the size of a plate crop and
  # nothing on any screen shows one.
  save_plate_crops: true
  save_vehicle_crops: false
  # Two per track, not the batch default of 25. The consensus keeps the best
  # read anyway, and 25 uploads per vehicle would be paying object-storage cost
  # to store 23 pictures nobody opens.
  max_crops_per_track: 2
  keyframes: false
  html_report: false
  events_jsonl: false

stream:
  # Publish the live-boxes channel as often as the worker analyses a frame.
  #
  # The default 0.2 s is a 5/s ceiling, and a live camera was measured
  # publishing 4.0 batches/s while the worker was analysing 10.2 fps — so the
  # cadence, not the inference, was setting how often a box could move. Every
  # gap between batches is carried by prediction along the vehicle's measured
  # velocity, and prediction is an extrapolation: halving the gap to ~100 ms
  # halves how far the box is ever extrapolated, which is what makes a
  # rectangle sit on the car rather than near it.
  #
  # It remains a ceiling, not a promise. A batch is only ever built from a
  # frame actually analysed, so this cannot invent positions — a worker
  # analysing 10 fps publishes 10 batches/s and no more, and one falling behind
  # publishes fewer. Bus cost is one message per camera per tick whatever the
  # vehicle count: measured 9.7 KB/s per camera at five a second.
  track_batch_s: 0.1
  # Emit the final event this long after a vehicle was last seen. Short enough
  # that history is timely, long enough to survive a brief occlusion.
  retire_after_s: 1.5
  observed_confidence_delta: 0.10
  max_observed_per_track: 3
