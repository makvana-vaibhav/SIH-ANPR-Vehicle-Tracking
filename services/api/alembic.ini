# ══════════════════════════════════════════════════════════════════════
#  Alembic — schema migrations for Sentinel-GJ
#
#  Schema changes are ALWAYS migrations, never create_all (CLAUDE.md §5).
#  The database URL is read from the environment in env.py, so no
#  credential appears in this file.
# ══════════════════════════════════════════════════════════════════════

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Migrations are numbered sequentially (0001, 0002, ...) so the build order
# is legible at a glance.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
