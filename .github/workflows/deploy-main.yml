name: Deploy Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MAIN_EC2_HOST }}
          username: ${{ secrets.MAIN_EC2_USER }}
          key: ${{ secrets.MAIN_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export GITHUB_REPOSITORY='${{ github.repository }}'
            export REPO_URL='https://github.com/${{ github.repository }}.git'
            if [ ! -d /opt/nagarnetra/main/.git ]; then
              sudo mkdir -p /opt/nagarnetra
              sudo chown -R "$USER":"$USER" /opt/nagarnetra
              git clone --branch main "$REPO_URL" /opt/nagarnetra/main
            fi
            bash /opt/nagarnetra/main/deploy/scripts/update_and_deploy.sh main main
