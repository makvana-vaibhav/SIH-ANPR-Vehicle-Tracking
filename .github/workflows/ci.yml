name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/nagarnetra

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Install API tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements-dev.txt

      - name: Lint API
        run: |
          cd services/api
          ruff check .

      - name: Typecheck and test web
        run: |
          cd web
          npm install
          npm run typecheck
          npm run test
