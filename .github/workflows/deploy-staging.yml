name: Deploy Staging

on:
  push:
    branches:
      - build/sentinel-gj
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export GITHUB_REPOSITORY='${{ github.repository }}'
            export REPO_URL='https://github.com/${{ github.repository }}.git'
            if [ ! -d /opt/sentinel-gj/staging/.git ]; then
              sudo mkdir -p /opt/sentinel-gj
              sudo chown -R "$USER":"$USER" /opt/sentinel-gj
              git clone --branch build/sentinel-gj "$REPO_URL" /opt/sentinel-gj/staging
            fi
            bash /opt/sentinel-gj/staging/deploy/scripts/update_and_deploy.sh staging build/sentinel-gj
