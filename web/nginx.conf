####################################################################
# Sentinel-GJ command centre — nginx
#
# Serves the SPA and reverse-proxies the API on the same origin, so the
# browser makes no cross-origin requests and WebSockets need no special
# CORS handling. One origin also means one TLS certificate in production.
####################################################################

upstream sentinel_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    # Dual-stack: the container healthcheck and any IPv6-first resolver reach
    # this over ::1. nginx's own ipv6 entrypoint script skips files it does not
    # recognise, so bind it explicitly here.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Operators paste plate numbers and case references; keep them out of
    # third-party referer headers.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Video (WebRTC/HLS) and map assets are same-origin or localhost only.
    # Tightened further in production — see docs/SECURITY.md.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:8000 http://localhost:8888 http://localhost:8889; worker-src 'self' blob:" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;   # camera-registry CSV bulk upload

    # ── Container healthcheck ──────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API proxy ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://sentinel_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit trail records the operator's source address; without
        # this the API would log every action as coming from nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── WebSocket: live event and alert stream ─────────────────────
    location /ws/ {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An idle alert feed must not be culled; the client reconnects with
        # backoff, but a needless drop is a gap in the operator's awareness.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets — content-hashed by Vite, safe to cache hard ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or operators keep an old bundle
        # after a deployment.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
