####################################################################
# Sentinel-GJ command centre — nginx
#
# Serves the SPA and reverse-proxies the API on the same origin, so the
# browser makes no cross-origin requests and WebSockets need no special
# CORS handling. One origin also means one TLS certificate in production.
####################################################################

upstream sentinel_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    # Dual-stack: the container healthcheck and any IPv6-first resolver reach
    # this over ::1. nginx's own ipv6 entrypoint script skips files it does not
    # recognise, so bind it explicitly here.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NGINX GOTCHA, do not undo: add_header directives are inherited by a
    # location block ONLY if that block declares no add_header of its own. A
    # single `add_header Cache-Control` inside `location /` silently drops
    # every header below for the entire app. Locations therefore use
    # `expires` / `default_type` instead. Verified by asserting the headers
    # are present on a real response.
    #
    # Operators paste plate numbers and case references; keep them out of
    # third-party referer headers.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Video (WebRTC/HLS) and map assets are same-origin or localhost only.
    # Tightened further in production — see docs/SECURITY.md.
    # The organisers' camera grid is an external media source: HLS playlists and
    # segments are fetched by hls.js (connect-src) and played by the video
    # element (media-src). Without both, the player fails with "Failed to fetch"
    # and the cause is invisible in the UI.
    #
    # Satellite imagery is the other external dependency, and it is optional:
    # the map falls back to the offline GeoJSON basemap when the tile host
    # is unreachable. Esri World Imagery needs no API key.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://*.arcgisonline.com; media-src 'self' blob: https://live.corp8.cloud; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:8000 http://localhost:8888 http://localhost:8889 https://live.corp8.cloud https://server.arcgisonline.com https://*.arcgisonline.com; worker-src 'self' blob:" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/geo+json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 25m;   # camera-registry CSV bulk upload

    # ── Container healthcheck ──────────────────────────────────────
    location = /healthz {
        access_log off;
        # `default_type`, not `add_header`: any add_header here would cancel
        # inheritance of the server-level security headers (see the note above
        # the CSP directive).
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API proxy ──────────────────────────────────────────────────
    location /api/ {
        # No trailing slash: the API's own routers are mounted under /api/v1,
        # so the prefix must be forwarded rather than stripped. With a slash
        # here, a same-origin deployment (VITE_API_BASE_URL empty) 404s on
        # every call while the split-origin dev setup keeps working — the kind
        # of difference that only shows up in production.
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit trail records the operator's source address; without
        # this the API would log every action as coming from nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ── WebSocket: live event and alert stream ─────────────────────
    location /ws/ {
        proxy_pass http://sentinel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An idle alert feed must not be culled; the client reconnects with
        # backoff, but a needless drop is a gap in the operator's awareness.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Static assets — content-hashed by Vite, safe to cache hard ──
    location /assets/ {
        # `expires` alone. Adding a Cache-Control add_header here would drop
        # every security header for hashed assets.
        expires 1y;
        access_log off;
    }

    # ── Federated camera grid, proxied ─────────────────────────────
    #
    # The organisers' HLS cannot be played by a browser directly, for three
    # compounding reasons found by probing it:
    #
    #   1. A fresh request 302-redirects to ?cookieCheck=1 — a cookie gate.
    #   2. That redirect points at **http://**, so an https page blocks it as
    #      mixed content before it is even followed.
    #   3. It answers `Access-Control-Allow-Origin: *` with no
    #      `Allow-Credentials`, so a cross-origin request may never carry the
    #      cookie the gate is waiting for. The gate is unsatisfiable from a
    #      browser, whatever the page does.
    #
    # Proxying solves all three at once: the cookie exchange happens
    # server-side where it works, and the browser sees ordinary same-origin
    # requests — no CORS, no mixed content, no third-party cookie rules. It
    # also means the CSP does not need to name an external media host.
    location /grid/ {
        proxy_pass https://live.corp8.cloud/;
        proxy_set_header Host live.corp8.cloud;
        proxy_ssl_server_name on;          # the upstream is behind SNI
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        # Bring the redirect and its cookie into our own origin, so the
        # browser's retry comes back through here carrying what the gate wants.
        # $http_host, not $host: the latter drops the port, so the browser is
        # sent to localhost:80 and the retry never arrives.
        proxy_redirect ~^https?://live\.corp8\.cloud/(.*)$ http://$http_host/grid/$1;

        # Deliberately send NO cookie upstream. The grid authorises segments two
        # different ways and only one of them works through a proxy:
        #
        #   with a cookie   playlists come back with bare segment names, and the
        #                   segments then 401 because the session lives in a
        #                   cookie the browser cannot carry cross-origin.
        #   without one     playlists come back with ?session=<uuid> on every
        #                   URL, and the browser propagates that by itself.
        #
        # Forwarding the cookie silently selects the broken path — playlists
        # load, video 401s, and it looks like the camera is down.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        # Cloudflare fingerprints clients and answers a bare proxy request with
        # error 1010 ("banned based on your browser's signature"). Forwarding
        # the real browser's own headers is both the fix and the honest thing to
        # send — this is a proxy for a browser, not a scraper pretending to be
        # one.
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header Referer https://live.corp8.cloud/;

        # Live media: stream it through rather than buffering whole segments,
        # and never cache a playlist that changes every few seconds.
        proxy_buffering off;
        proxy_read_timeout 60s;
        expires -1;
    }

    # ── SPA fallback ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or operators keep an old bundle
        # after a deployment. `expires -1` emits the no-cache headers WITHOUT
        # using add_header — which would silently disable CSP on the app route.
        expires -1;
    }
}
