services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-postgres
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-redis
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"

  minio:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-minio
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  minio-init:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-minio-init

  opensearch:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-opensearch
    ports:
      - "${OPENSEARCH_BIND_ADDRESS:-127.0.0.1}:${OPENSEARCH_HOST_PORT:-9200}:9200"

  mediamtx:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-mediamtx
    ports:
      - "${MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_HLS_PORT:-8888}:8888"
      - "${MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:${MEDIAMTX_API_PORT:-9997}:9997"
      - "${MEDIAMTX_BIND_ADDRESS:-127.0.0.1}:8189:8189/udp"

  api:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-api
    build:
      args:
        INSTALL_DEV: "false"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data/seed:/data/seed:ro
      - ./data/videos:/data/videos

  web:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-web
    build:
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"

  ingest:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-ingest
    volumes: []

  simulator:
    container_name: ${COMPOSE_PROJECT_NAME:-sentinel}-simulator
    ports:
      - "${SIMULATOR_BIND_ADDRESS:-127.0.0.1}:${SIMULATOR_HOST_PORT:-9100}:9100"
    volumes:
      - ./data/videos:/data/videos:ro
