<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="1400" height="1020" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1400" height="1020" fill="#ffffff"/>
  <text x="48" y="50" font-size="28" font-weight="700" fill="#0f172a">Sentinel-GJ — Workflow &amp; Integration</text>
  <text x="48" y="76" font-size="15" fill="#475569">Onboarding a camera · a vehicle passing it · a watchlist hit · a route reconstructed. Timings are measured on one laptop, CPU only.</text>

  <!-- ── A: ONBOARDING ── -->
  <rect x="40" y="100" width="1320" height="152" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="126" font-size="14" font-weight="700" fill="#0f172a">A · ONBOARDING A CAMERA — three routes, one validation path</text>
  <g font-size="12">
    <rect x="60" y="140" width="180" height="46" rx="6" fill="#fff" stroke="#94a3b8"/><text x="76" y="162" font-weight="600">Bulk CSV upload</text><text x="76" y="178" font-size="10.5" fill="#475569">per-row errors returned</text>
    <rect x="60" y="192" width="180" height="46" rx="6" fill="#fff" stroke="#94a3b8"/><text x="76" y="214" font-weight="600">Manual form</text><text x="76" y="230" font-size="10.5" fill="#475569">operator / supervisor</text>
    <rect x="256" y="166" width="180" height="46" rx="6" fill="#fff" stroke="#94a3b8"/><text x="272" y="188" font-weight="600">Self-registration API</text><text x="272" y="204" font-size="10.5" fill="#475569">api_client key, other dept.</text>
    <line x1="240" y1="163" x2="256" y2="180" stroke="#94a3b8" marker-end="url(#ag)"/>
    <line x1="240" y1="215" x2="256" y2="198" stroke="#94a3b8" marker-end="url(#ag)"/>
    <line x1="436" y1="189" x2="474" y2="189" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="476" y="152" width="184" height="74" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="492" y="174" font-weight="600" fill="#1e40af">Validation</text>
    <text x="492" y="192" font-size="10.5" fill="#475569">geographic bounds check</text>
    <text x="492" y="208" font-size="10.5" fill="#475569">duplicate code, adapter type</text>
    <line x1="660" y1="189" x2="698" y2="189" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="700" y="152" width="184" height="74" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="716" y="174" font-weight="600" fill="#1e40af">Registry row</text>
    <text x="716" y="192" font-size="10.5" fill="#475569">PostGIS Geography POINT</text>
    <text x="716" y="208" font-size="10.5" fill="#475569">dept · VMS · adapter · ANPR flag</text>
    <line x1="884" y1="189" x2="922" y2="189" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="924" y="152" width="180" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="940" y="174" font-weight="600" fill="#166534">On the GIS map</text>
    <text x="940" y="192" font-size="10.5" fill="#475569">clustered, status-coloured</text>
    <text x="940" y="208" font-size="10.5" fill="#475569">filters by dept/district/status</text>
    <line x1="1104" y1="189" x2="1142" y2="189" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="1144" y="152" width="196" height="74" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="1160" y="174" font-weight="600" fill="#92400e">Health probing begins</text>
    <text x="1160" y="192" font-size="10.5" fill="#475569">staggered cycle → hypertable</text>
    <text x="1160" y="208" font-size="10.5" fill="#78350f" font-weight="600">offline detected in 19 s</text>
  </g>

  <!-- ── B: A VEHICLE PASSES ── -->
  <rect x="40" y="268" width="1320" height="246" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="60" y="294" font-size="14" font-weight="700" fill="#0e7490">B · A VEHICLE PASSES THE CAMERA — the hot path, edge to operator</text>
  <g font-size="11.5">
    <rect x="60" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="74" y="332" font-weight="600" font-size="12">1 · Frame read</text><text x="74" y="349" font-size="10.5" fill="#475569">drop-to-latest, never</text><text x="74" y="363" font-size="10.5" fill="#475569">queue stale frames</text>
    <line x1="210" y1="340" x2="240" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="242" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="256" y="332" font-weight="600" font-size="12">2 · Vehicle detect</text><text x="256" y="349" font-size="10.5" fill="#475569">YOLO ONNX, CPU</text><text x="256" y="363" font-size="10.5" fill="#475569">GPU optional</text>
    <line x1="392" y1="340" x2="422" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="424" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="438" y="332" font-weight="600" font-size="12">3 · Track</text><text x="438" y="349" font-size="10.5" fill="#475569">ByteTrack, one identity</text><text x="438" y="363" font-size="10.5" fill="#475569">across many frames</text>
    <line x1="574" y1="340" x2="604" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="606" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="620" y="332" font-weight="600" font-size="12">4 · Plate detect</text><text x="620" y="349" font-size="10.5" fill="#475569">inside the track ROI</text><text x="620" y="363" font-size="10.5" fill="#475569">not the whole frame</text>
    <line x1="756" y1="340" x2="786" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="788" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="802" y="332" font-weight="600" font-size="12">5 · Rectify</text><text x="802" y="349" font-size="10.5" fill="#475569">4-point warp, CLAHE,</text><text x="802" y="363" font-size="10.5" fill="#475569">upscale</text>
    <line x1="938" y1="340" x2="968" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="970" y="310" width="150" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="984" y="332" font-weight="600" font-size="12">6 · OCR</text><text x="984" y="349" font-size="10.5" fill="#475569">ONNX CRNN, per-char</text><text x="984" y="363" font-size="10.5" fill="#475569">confidence retained</text>
    <line x1="1120" y1="340" x2="1150" y2="340" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1152" y="310" width="188" height="60" rx="6" fill="#fff" stroke="#0891b2"/><text x="1166" y="332" font-weight="600" font-size="12">7 · Repeat per frame</text><text x="1166" y="349" font-size="10.5" fill="#475569">reads buffered per track,</text><text x="1166" y="363" font-size="10.5" fill="#475569">nothing emitted yet</text>
  </g>
  <rect x="60" y="384" width="1280" height="64" rx="8" fill="#0e7490"/>
  <text x="80" y="408" font-size="13.5" font-weight="700" fill="#ffffff">8 · MULTI-FRAME CONSENSUS — the accuracy story, and why one car makes one record</text>
  <text x="80" y="425" font-size="11" fill="#cffafe">Character-position voting weighted by (OCR confidence × crop sharpness). Position-aware confusion correction resolved by slot:</text>
  <text x="80" y="440" font-size="11" fill="#cffafe">0↔O and 1↔I only where the format expects a letter. Grammar-validated against Indian and BH-series formats — invalid reads are flagged, never dropped.</text>
  <g font-size="11.5">
    <line x1="700" y1="448" x2="700" y2="462" stroke="#0891b2" stroke-width="2" marker-end="url(#a)"/>
    <rect x="60" y="464" width="400" height="40" rx="6" fill="#fff" stroke="#0891b2"/>
    <text x="76" y="480" font-weight="600" font-size="12">9 · ONE event per vehicle → Redis Stream</text>
    <text x="76" y="496" font-size="10.5" fill="#475569">~2 KB: plate, confidence, top-3 candidates, per-frame reads, bbox</text>
    <rect x="476" y="464" width="400" height="40" rx="6" fill="#fff" stroke="#0891b2"/>
    <text x="492" y="480" font-weight="600" font-size="12">10a · Every API replica tails the stream</text>
    <text x="492" y="496" font-size="10.5" fill="#475569">XREAD — every operator sees every event, live on the map</text>
    <rect x="892" y="464" width="448" height="40" rx="6" fill="#fff" stroke="#0891b2"/>
    <text x="908" y="480" font-weight="600" font-size="12">10b · Consumer group persists it exactly once</text>
    <text x="908" y="496" font-size="10.5" fill="#475569">N workers share the fleet N ways · batched writes · measured p95 5.7 s at statewide rate</text>
  </g>

  <!-- ── C: WATCHLIST ── -->
  <rect x="40" y="530" width="650" height="222" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="556" font-size="14" font-weight="700" fill="#991b1b">C · WATCHLIST HIT — nobody has to be watching</text>
  <g font-size="11.5">
    <rect x="60" y="570" width="270" height="54" rx="6" fill="#fff" stroke="#dc2626"/>
    <text x="76" y="590" font-weight="600" font-size="12">Deletion-index match</text>
    <text x="76" y="606" font-size="10.5" fill="#475569">O(plate length), not O(watchlist)</text>
    <text x="76" y="620" font-size="10.5" fill="#475569">exact + edit-distance-1 near match</text>
    <line x1="330" y1="597" x2="358" y2="597" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="360" y="570" width="310" height="54" rx="6" fill="#fff" stroke="#dc2626"/>
    <text x="376" y="590" font-weight="600" font-size="12">Alert raised in the same transaction</text>
    <text x="376" y="606" font-size="10.5" fill="#475569">an alert without its detection, or a detection</text>
    <text x="376" y="620" font-size="10.5" fill="#475569">that failed to alert, are both worse than a rollback</text>
    <line x1="365" y1="624" x2="365" y2="646" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="60" y="648" width="610" height="44" rx="6" fill="#fff" stroke="#dc2626"/>
    <text x="76" y="668" font-weight="600" font-size="12">Pub/sub fan-out → every API replica → every connected operator</text>
    <text x="76" y="684" font-size="10.5" fill="#475569">Measured: detection → alert on a connected client in 24 ms. Near matches capped at medium priority and labelled possible_match.</text>
    <rect x="60" y="700" width="610" height="38" rx="6" fill="#fff" stroke="#dc2626"/>
    <text x="76" y="718" font-weight="600" font-size="12">Lifecycle: new → acknowledged → dispatched → closed / false positive</text>
    <text x="76" y="732" font-size="10.5" fill="#475569">Each transition is a separate permission — acknowledging is routine, dispatching commits a unit, closing ends the record.</text>
  </g>

  <!-- ── D: ROUTE ── -->
  <rect x="710" y="530" width="650" height="222" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="556" font-size="14" font-weight="700" fill="#5b21b6">D · SEARCH A PLATE → A ROUTE ACROSS CAMERAS</text>
  <g font-size="11.5">
    <rect x="730" y="570" width="610" height="42" rx="6" fill="#fff" stroke="#7c3aed"/>
    <text x="746" y="588" font-weight="600" font-size="12">1 · Fetch every sighting by plate + time window — and write an audit row</text>
    <text x="746" y="604" font-size="10.5" fill="#475569">Reconstructing a person's movements is the most privacy-sensitive read in the platform, so it is audited explicitly.</text>
    <rect x="730" y="618" width="610" height="42" rx="6" fill="#fff" stroke="#7c3aed"/>
    <text x="746" y="636" font-weight="600" font-size="12">2 · Cluster into hops — merge repeat sightings at one camera within a dwell window</text>
    <text x="746" y="652" font-size="10.5" fill="#475569">Otherwise a car queuing at a junction becomes forty hops going nowhere.</text>
    <rect x="730" y="666" width="610" height="42" rx="6" fill="#fff" stroke="#7c3aed"/>
    <text x="746" y="684" font-weight="600" font-size="12">3 · Score each leg: great-circle distance ÷ elapsed time = implied speed</text>
    <text x="746" y="700" font-size="10.5" fill="#475569">Straight-line, so the implied speed is a LOWER BOUND — the real road is longer. Flag &gt;150 km/h as implausible with confidence.</text>
    <rect x="730" y="714" width="610" height="24" rx="6" fill="#5b21b6"/>
    <text x="746" y="731" font-size="11.5" font-weight="600" fill="#ffffff">4 · GeoJSON route drawn on the map + ordered hop table — uncertain legs marked, not hidden</text>
  </g>

  <!-- ── E: SCALE ── -->
  <rect x="40" y="768" width="1320" height="216" rx="10" fill="#0f172a"/>
  <text x="60" y="796" font-size="14" font-weight="700" fill="#67e8f9">E · WHY THIS SCALES TO 80,000 CAMERAS — measured, not asserted</text>
  <g font-size="12">
    <rect x="60" y="812" width="300" height="72" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="78" y="834" fill="#f1f5f9" font-weight="600">Centralise the video</text>
    <text x="78" y="858" fill="#f87171" font-size="20" font-weight="700">320 Gbps</text>
    <text x="78" y="875" fill="#94a3b8" font-size="10.5">80,000 × 4 Mbps H.264 — new fibre, statewide</text>
    <text x="378" y="852" fill="#67e8f9" font-size="22" font-weight="700">vs</text>
    <rect x="424" y="812" width="300" height="72" rx="8" fill="#1e293b" stroke="#0891b2"/>
    <text x="442" y="834" fill="#f1f5f9" font-weight="600">Federate the events</text>
    <text x="442" y="858" fill="#4ade80" font-size="20" font-weight="700">43 Mbps</text>
    <text x="442" y="875" fill="#94a3b8" font-size="10.5">2,667 ev/s × ~2 KB — fits an existing district uplink</text>
    <rect x="748" y="812" width="290" height="72" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="766" y="834" fill="#f1f5f9" font-weight="600">Ratio</text>
    <text x="766" y="860" fill="#67e8f9" font-size="22" font-weight="700">~7,000×</text>
    <text x="766" y="876" fill="#94a3b8" font-size="10.5">the whole argument for Model 5 over Model 4</text>
    <rect x="1052" y="812" width="288" height="72" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="1070" y="834" fill="#f1f5f9" font-weight="600">On-demand viewing</text>
    <text x="1070" y="858" fill="#4ade80" font-size="18" font-weight="700">200 Mbps</text>
    <text x="1070" y="876" fill="#94a3b8" font-size="10.5">50 concurrent operators — an unwatched camera costs 0</text>
  </g>
  <rect x="60" y="898" width="1280" height="68" rx="8" fill="#0e7490"/>
  <text x="80" y="920" font-size="12.5" font-weight="700" fill="#ffffff">MEASURED — 80,000 camera identities, 3 ingest workers, one laptop, CPU only</text>
  <text x="80" y="940" font-size="11.5" fill="#cffafe">2,774 events/s sustained vs 2,664 offered · 388,713 events written · 0 failures · 397 watchlist alerts raised under load · backlog cleared</text>
  <text x="80" y="958" font-size="11.5" fill="#a5f3fc">The load test found a real bug: upper(camera_code) defeated the index. At 281 cameras invisible; at 80,000 it was a 106 ms sequential scan per batch that collapsed ingest 7.5×. Fixed by migration 0003.</text>
</svg>
